[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agentic-workflow"
version = "0.1.0"
description = "A documented, extensible LangGraph framework for finance AI workflows, starting with an equity-research assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "a.marques.sn" }]
keywords = ["langgraph", "langchain", "anthropic", "claude", "finance", "agents", "equity-research"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Live market data. The workflow runs without this (it falls back to sample data),
# but installing it enables real yfinance lookups.
live = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
finwf = "finance_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_workflow = ["data/samples/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
