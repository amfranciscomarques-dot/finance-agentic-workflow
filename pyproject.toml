[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agentic-workflow"
version = "0.1.0"
description = "A documented, extensible LangGraph framework for finance AI workflows, starting with an equity-research assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "a.marques.sn" }]
keywords = ["langgraph", "langchain", "anthropic", "claude", "finance", "agents", "equity-research"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # `langchain` provides the provider-agnostic init_chat_model factory.
    "langchain>=0.3.0",
    # Anthropic is the default provider, so its integration ships by default.
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Live market data. The workflow runs without this (it falls back to sample data),
# but installing it enables real yfinance lookups.
live = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

# LLM providers. Anthropic works out of the box; install an extra to use another
# provider with FINWF_MODEL (e.g. `pip install -e ".[openai]"` then
# `FINWF_MODEL=gpt-4o`). All resolve through the same init_chat_model factory.
openai = ["langchain-openai>=0.2"]
google = ["langchain-google-genai>=2.0"]
groq = ["langchain-groq>=0.2"]
mistral = ["langchain-mistralai>=0.2"]
ollama = ["langchain-ollama>=0.2"]

[project.scripts]
finwf = "finance_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_workflow = ["data/samples/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
